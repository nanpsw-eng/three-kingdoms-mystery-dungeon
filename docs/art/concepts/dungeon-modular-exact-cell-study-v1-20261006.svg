<g font-family="sans-serif" font-size="15" fill="#756C63"><text x="44" y="820">Floor values stay within the hanji/warm-stone family; seam noise is sparse. The dark geometry uses shared wall thickness and edge rules.</text><text x="44" y="846">Corner rotations join orthogonal edge strokes; the doorway opening is one logical cell. This verifies authored SVG joins only, not the current map renderer or Canvas scaling.</text></g>
