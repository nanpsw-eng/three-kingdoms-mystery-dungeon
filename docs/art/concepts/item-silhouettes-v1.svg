<text x="48" y="900" font-family="sans-serif" font-size="17" fill="#756C63">At 26px each category reads by silhouette: bowl, gourd, tied slats, blade, cuirass, jade seal, and parcel.</text>
<text x="48" y="932" font-family="sans-serif" font-size="17" fill="#756C63">Unknown is a wrapped parcel with a question mark. Treasure starts with a jade-seal silhouette; vermilion is secondary.</text>
<text x="48" y="964" font-family="sans-serif" font-size="17" fill="#756C63">Vector study only; renderer sizing, inventory context, and live fog remain unverified.</text>
