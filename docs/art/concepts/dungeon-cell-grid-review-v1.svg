<text x="432" y="193" font-size="6">room walls meet floor</text>
<text x="432" y="207" font-size="6">opening joins corridor</text>
<text x="432" y="221" font-size="6">angular trap / open ring</text>
<text x="432" y="235" font-size="6">dense sorcery detail at 26px</text>
<text x="432" y="249" font-size="6">fog opacity needs live review</text>
