<text x="432" y="64" font-size="7" font-weight="700">CELL CHECK</text>
<text x="432" y="80" font-size="6">corridor width: 1 cell</text>
<text x="432" y="94" font-size="6">stair / gate: 1 cell</text>
<text x="432" y="108" font-size="6">chest / pot: 1 cell each</text>
<text x="432" y="122" font-size="6">player / scout: 1 cell each</text>
<text x="432" y="136" font-size="6">trap / sorcery: 1 cell each</text>
<text x="432" y="150" font-size="6">fog overlays explored edge</text>
