<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 560 310" role="img" aria-labelledby="title desc">
<title id="title">Dungeon exact-cell review board</title>
<desc id="desc">Concept-only deterministic composition using 26 unit map cells. One explored room connects through a one-cell corridor to a second room with fog over its east side.</desc>
<rect width="560" height="310" fill="#E8DDC4"/>
<text x="24" y="27" font-family="sans-serif" font-size="9" font-weight="700" fill="#171513">DUNGEON CELL GRID REVIEW · 26px LOGICAL CELLS · CONCEPT</text>
<text x="24" y="41" font-family="sans-serif" font-size="6" fill="#756C63">Atlas crops are clipped to single cells; board display is 2×. Illustrative layout only.</text>
