<text x="48" y="962" font-family="sans-serif" font-size="17" fill="#756C63">At one logical cell: distinct silhouettes carry meaning; color is only a secondary cue. Trap alone uses vermilion as a restrained danger mark.</text>
<text x="48" y="993" font-family="sans-serif" font-size="17" fill="#756C63">The feathered 28% charcoal sample softens detail without swallowing the stair edge, cross-trap, ring/flame, helmet/spear, or pot handles.</text>
<text x="48" y="1024" font-family="sans-serif" font-size="17" fill="#756C63">Authored vector design concept; renderer alpha, map integration, and production export remain unverified.</text>
